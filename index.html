<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#2e73fc" />
<meta name="apple-mobile-web-app-title" content="할일요정" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="manifest" href="manifest.webmanifest" />
<title>할일요정</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
<style>
  :root{
    --ink:#172b4d; --muted:#626f86; --line:#e4e6ea; --accent:#0c66e4; --accent-soft:#e9f2ff;
    --danger:#c9372c; --danger-soft:#ffeceb; --warn:#a54800; --warn-soft:#fff1e0; --green:#1f845a; --green-soft:#dcfff1;
  }
  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{ margin:0; color:var(--ink); background:#0b3d91; -webkit-tap-highlight-color:transparent;
    font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',sans-serif; letter-spacing:-0.01em; }
  button,input,select,textarea{ font-family:inherit; font-size:16px; color:var(--ink); }
  .muted{ color:var(--muted); font-size:13px; }

  /* ---------- 로그인 ---------- */
  #login,#app{ display:none; }
  #login{ min-height:100vh; align-items:center; justify-content:center; padding:16px;
    background:linear-gradient(135deg,#1d4ed8 0%,#6d28d9 55%,#be3a8d 100%); }
  .login-card{ background:#fff; border-radius:16px; padding:32px 28px; width:100%; max-width:340px; text-align:center; box-shadow:0 12px 40px rgba(9,30,66,.35); }
  .login-card h1{ font-size:22px; margin:0 0 6px; }
  .login-card input{ margin-top:8px; }

  /* ---------- 공통 입력/버튼 ---------- */
  input,textarea,select{ width:100%; padding:10px 12px; border:1px solid #cfd4dc; border-radius:8px; background:#fff; min-height:44px; -webkit-appearance:none; appearance:none; }
  textarea{ min-height:84px; resize:vertical; }
  input:focus,textarea:focus,select:focus{ outline:2px solid var(--accent); outline-offset:-1px; border-color:transparent; }
  select{ background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%23626f86' stroke-width='2'/></svg>") no-repeat right 12px center; padding-right:34px; }
  input[type=date]{ display:block; min-width:0; }
  label{ display:block; font-size:13px; font-weight:600; color:#44546f; margin:14px 0 5px; }
  .btn{ white-space:nowrap; border:0; background:#091e420f; color:var(--ink); min-height:40px; padding:8px 16px; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; }
  .btn:hover{ background:#091e4224; }
  .btn.primary{ background:var(--accent); color:#fff; } .btn.primary:hover{ background:#0055cc; }
  .btn.danger{ background:var(--danger-soft); color:var(--danger); }
  .btn.small{ min-height:34px; padding:5px 12px; font-size:13px; }
  .btn.glass{ background:rgba(255,255,255,.2); color:#fff; } .btn.glass:hover{ background:rgba(255,255,255,.32); }
  .row{ display:flex; gap:10px; } .row > *{ flex:1; min-width:0; }
  .checks{ display:flex; flex-wrap:wrap; gap:6px 18px; }
  .checks label{ display:flex; align-items:center; gap:8px; margin:0; font-weight:500; color:var(--ink); font-size:15px; min-height:36px; }
  .checks input{ width:20px; height:20px; min-height:0; -webkit-appearance:auto; appearance:auto; }

  /* ---------- 앱 ---------- */
  #app{ min-height:100vh; min-height:100dvh; flex-direction:column;
    background:linear-gradient(135deg,#1d4ed8 0%,#6d28d9 55%,#be3a8d 100%); }
  .bar{ display:flex; align-items:center; gap:10px; padding:10px 20px; padding-top:max(10px, env(safe-area-inset-top));
    background:rgba(0,0,0,.28); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); color:#fff; }
  .logo{ font-size:19px; font-weight:800; white-space:nowrap; }
  .spacer{ flex:1; }
  .pill{ font-size:12.5px; font-weight:700; padding:5px 10px; border-radius:99px; background:rgba(255,255,255,.2); color:#fff; white-space:nowrap; }
  .pill.link{ cursor:pointer; }
  .who{ font-size:13px; opacity:.9; white-space:nowrap; }

  #wrap{ width:100%; max-width:1280px; margin:0 auto; padding:16px 20px 40px; display:flex; flex-direction:column; gap:14px; }
  #tgBanner{ display:none; background:#fff; border-radius:12px; padding:14px 16px; align-items:center; gap:12px; flex-wrap:wrap; box-shadow:0 2px 8px rgba(9,30,66,.25); }

  /* 업무 목록 + (넓은 화면) 오른쪽 시세/뉴스 열 */
  #main{ display:flex; flex-direction:column; gap:14px; min-width:0; }
  #side{ display:none; }
  .side-card{ background:#fff; border-radius:14px; box-shadow:0 2px 10px rgba(9,30,66,.22); overflow:hidden; }
  .side-h{ display:flex; align-items:center; justify-content:space-between; padding:12px 16px; font-size:15px; font-weight:800; border-bottom:1px solid var(--line); }
  .side-h .muted{ font-weight:500; font-size:12px; }
  .q-row{ display:grid; grid-template-columns:1fr auto auto; gap:10px; align-items:baseline; padding:8px 16px; font-size:14px; border-bottom:1px solid #f0f1f3; }
  .q-row:last-child{ border-bottom:0; }
  .q-name{ color:#44546f; font-weight:600; } .q-price{ font-weight:800; font-variant-numeric:tabular-nums; }
  .q-chg{ font-size:12.5px; font-weight:700; min-width:92px; text-align:right; font-variant-numeric:tabular-nums; }
  .q-chg.up{ color:#d6342c; } .q-chg.down{ color:#0c66e4; } .q-chg.flat{ color:var(--muted); }
  #news{ overflow-y:auto; max-height:calc(100vh - 520px); min-height:260px; }
  .ni{ display:block; padding:11px 16px; border-bottom:1px solid #f0f1f3; text-decoration:none; color:var(--ink); }
  .ni:hover{ background:#f6f8ff; }
  .ni .nm{ display:flex; gap:8px; align-items:center; font-size:12px; color:var(--muted); margin-bottom:3px; }
  .ni .src{ font-weight:800; color:#5b3fc4; background:#e5e1fa; padding:1px 7px; border-radius:5px; }
  .ni .nt{ font-size:14px; font-weight:600; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .side-empty{ padding:22px 16px; color:var(--muted); font-size:13.5px; text-align:center; }
  @media (min-width:1500px){
    #wrap{ max-width:1680px; display:grid; grid-template-columns:minmax(0,1fr) 350px; gap:14px 18px; align-items:start; }
    #tgBanner{ grid-column:1 / -1; }
    #side{ display:flex; flex-direction:column; gap:14px; position:sticky; top:16px; }
  }

  /* 요약 타일 */
  #tiles{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .tile{ background:rgba(255,255,255,.96); border-radius:14px; padding:14px 18px; cursor:pointer; border:2px solid transparent; box-shadow:0 1px 3px rgba(9,30,66,.18); text-align:left; }
  .tile:hover{ background:#fff; }
  .tile.sel{ border-color:var(--accent); }
  .tile .n{ font-size:28px; font-weight:800; line-height:1.1; }
  .tile .l{ font-size:13.5px; color:var(--muted); margin-top:3px; font-weight:600; }
  .tile.over .n{ color:var(--danger); } .tile.today .n{ color:var(--warn); } .tile.loan .n{ color:var(--accent); }

  /* 목록 패널 */
  .list-panel{ background:#fff; border-radius:14px; box-shadow:0 2px 10px rgba(9,30,66,.22); overflow:hidden; }
  .toolbar{ display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .seg{ display:flex; background:#091e420f; padding:3px; border-radius:9px; }
  .seg button{ border:0; background:transparent; padding:6px 14px; border-radius:7px; font-size:14px; font-weight:700; color:#44546f; cursor:pointer; }
  .seg button.on{ background:#fff; color:var(--ink); box-shadow:0 1px 2px #091e4233; }
  .toolbar select{ width:auto; min-height:38px; padding:6px 32px 6px 12px; font-size:14px; }
  .toolbar .search{ flex:1; min-width:140px; min-height:38px; padding:6px 12px; font-size:14px; }
  .chk{ display:flex; align-items:center; gap:7px; font-size:14px; font-weight:600; color:#44546f; margin:0; cursor:pointer; white-space:nowrap; }
  .chk input{ width:18px; height:18px; min-height:0; -webkit-appearance:auto; appearance:auto; }

  .thead,.trow{ display:grid; grid-template-columns:58px minmax(200px,1fr) 250px 96px 86px 150px; gap:12px; align-items:center; padding:0 18px; }
  .thead{ font-size:12px; font-weight:700; color:var(--muted); padding-top:9px; padding-bottom:9px; border-bottom:1px solid var(--line); background:#fafbfc; }
  .sec-h{ display:flex; align-items:center; gap:8px; padding:9px 18px; font-size:14px; font-weight:800; border-bottom:1px solid var(--line); }
  .sec-h .n{ font-weight:700; opacity:.7; }
  .sec-h.over{ background:var(--danger-soft); color:var(--danger); } .sec-h.today{ background:var(--warn-soft); color:var(--warn); }
  .sec-h.prog{ background:#f1f2f4; color:#44546f; } .sec-h.done{ background:var(--green-soft); color:var(--green); }
  .trow{ min-height:58px; padding-top:9px; padding-bottom:9px; border-bottom:1px solid var(--line); cursor:pointer; }
  .trow:hover{ background:#f6f8ff; }
  .trow.done{ opacity:.7; }
  .tp{ display:inline-block; font-size:12px; font-weight:800; padding:3px 8px; border-radius:6px; background:#dbeafe; color:#0b5cc4; text-align:center; }
  .tp.loan{ background:#e5e1fa; color:#5b3fc4; }
  .tt{ font-size:15.5px; font-weight:700; line-height:1.35; word-break:break-word; }
  .ts{ font-size:12.5px; color:var(--muted); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .prog{ display:flex; align-items:center; gap:9px; min-width:0; }
  .segs{ display:flex; gap:3px; flex-shrink:0; }
  .segs i{ display:block; width:20px; height:8px; border-radius:99px; background:#dcdfe4; }
  .segs i.ok{ background:var(--green); } .segs i.cur{ background:var(--accent); }
  .pl{ font-size:13px; color:#44546f; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pl b{ color:var(--ink); } .pl.ok{ color:var(--green); font-weight:700; }
  .avs{ display:flex; padding-left:6px; }
  .av{ width:28px; height:28px; border-radius:50%; color:#fff; font-size:12.5px; font-weight:700; display:flex; align-items:center; justify-content:center; border:2px solid #fff; margin-left:-6px; position:relative; flex-shrink:0; }
  .av.done::after{ content:'✓'; position:absolute; right:-5px; bottom:-5px; width:14px; height:14px; border-radius:50%; background:var(--green); color:#fff; font-size:9px; line-height:14px; text-align:center; border:1.5px solid #fff; }
  .chip{ display:inline-flex; align-items:center; gap:4px; font-size:12.5px; font-weight:700; padding:3px 9px; border-radius:6px; background:#091e420f; color:#44546f; white-space:nowrap; }
  .chip.over{ background:var(--danger); color:#fff; } .chip.today{ background:#f5cd47; color:#533f04; } .chip.ok{ background:var(--green-soft); color:var(--green); }
  .go{ width:100%; border:0; background:var(--accent-soft); color:var(--accent); font-weight:700; font-size:13px; padding:8px 10px; border-radius:7px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .go:hover{ background:#cfe4ff; }
  .empty{ color:var(--muted); font-size:14px; padding:36px 16px; text-align:center; }

  /* ---------- 모달 ---------- */
  .ov{ display:none; position:fixed; inset:0; z-index:20; background:rgba(9,30,66,.6); overflow-y:auto; -webkit-overflow-scrolling:touch; padding:max(24px, env(safe-area-inset-top)) 12px 32px; }
  .panel{ background:#fff; border-radius:14px; max-width:620px; margin:0 auto; padding:22px; box-shadow:0 12px 40px rgba(9,30,66,.4); }
  .panel h2{ margin:0; font-size:19px; line-height:1.35; word-break:break-word; }
  .ph{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .x{ border:0; background:#091e420f; width:34px; height:34px; border-radius:50%; font-size:16px; cursor:pointer; flex-shrink:0; }
  .kv{ margin-top:14px; } .kv .k{ font-size:12.5px; font-weight:700; color:var(--muted); margin-bottom:4px; } .kv .v{ font-size:15px; white-space:pre-wrap; line-height:1.5; }
  .steps{ display:flex; flex-wrap:wrap; gap:6px; }
  .step{ display:flex; align-items:center; gap:6px; padding:6px 12px; border-radius:99px; border:1px solid var(--line); font-size:14px; color:var(--muted); background:#fff; }
  .step.ok{ background:var(--green-soft); color:var(--green); border-color:transparent; }
  .step.cur{ background:var(--accent-soft); color:var(--accent); border-color:var(--accent); font-weight:800; }
  .step small{ font-size:11px; opacity:.85; }
  .acts{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .asg{ display:flex; align-items:center; gap:10px; min-height:40px; font-size:15px; }
  .asg input{ width:22px; height:22px; min-height:0; -webkit-appearance:auto; appearance:auto; flex-shrink:0; }
  .asg.ok{ color:var(--green); }
  .foot{ display:flex; gap:8px; margin-top:20px; padding-top:16px; border-top:1px solid var(--line); flex-wrap:wrap; }

  /* ---------- 좁은 화면(모바일/작은 창): 한 업무를 두 줄 리스트로 ---------- */
  @media (max-width:900px){
    .thead{ display:none; }
    .trow{ grid-template-columns:auto minmax(0,1fr) auto; grid-template-areas:"type title due" ". prog prog" ". who act"; gap:6px 10px; padding:12px 14px; align-items:center; }
    .c-type{ grid-area:type; } .c-title{ grid-area:title; } .c-due{ grid-area:due; justify-self:end; }
    .c-prog{ grid-area:prog; } .c-who{ grid-area:who; } .c-act{ grid-area:act; justify-self:end; }
    .go{ width:auto; padding:8px 14px; font-size:13.5px; }
    .tt{ font-size:15px; }
    .sec-h{ padding:9px 14px; }
    .toolbar{ padding:10px 12px; }
    .toolbar .search{ order:9; flex-basis:100%; }
    #tiles{ grid-template-columns:repeat(2,1fr); gap:10px; }
    .tile{ padding:12px 14px; } .tile .n{ font-size:24px; }
  }
  @media (max-width:760px){
    .bar{ padding:8px 12px; padding-top:max(8px, env(safe-area-inset-top)); gap:8px; }
    .who{ display:none; }
    .logo{ font-size:17px; }
    .pill{ font-size:12px; padding:5px 9px; }
    #wrap{ padding:12px 12px 32px; gap:12px; }
  }
</style>
</head>
<body>
<div id="login"><div class="login-card">
  <h1>🧚 할일요정</h1>
  <p class="muted">등록된 이메일과 비밀번호로 로그인합니다.</p>
  <input id="emailInput" type="email" placeholder="이메일" autocomplete="username" />
  <input id="pwInput" type="password" placeholder="비밀번호" autocomplete="current-password" />
  <button class="btn primary" id="loginBtn" style="width:100%;margin-top:12px;min-height:46px">로그인</button>
  <p id="loginMsg" class="muted"></p>
</div></div>

<div id="app">
  <div class="bar">
    <span class="logo">🧚 할일요정</span>
    <span class="spacer"></span>
    <span class="pill link" id="tgPill" title="텔레그램 다시 연결" style="display:none"></span>
    <button class="btn glass small" id="newBtn">＋ 새 업무</button>
    <span class="who" id="who"></span>
    <button class="btn glass small" id="logout">로그아웃</button>
  </div>
  <div id="wrap">
    <div id="tgBanner"><b>🔔 텔레그램 알림</b><span id="tgStatus" class="muted" style="flex:1"></span></div>
    <div id="main">
    <div id="tiles"></div>
    <div class="list-panel">
      <div class="toolbar">
        <div class="seg" id="typeSeg">
          <button data-type="all">전체</button><button data-type="loan">대출진행</button><button data-type="general">일반업무</button>
        </div>
        <select id="status"><option value="open">미완료</option><option value="done">완료</option><option value="all">전체 상태</option></select>
        <label class="chk"><input type="checkbox" id="mine" /> 내 업무만</label>
        <input id="q" class="search" type="search" placeholder="🔍 업무·고객명·요청자 검색" />
      </div>
      <div class="thead"><span>구분</span><span>업무</span><span>진행</span><span>담당</span><span>기한</span><span></span></div>
      <div id="list"></div>
    </div>
    </div>
    <aside id="side">
      <div class="side-card"><div class="side-h"><span>📈 시세정보</span><span class="muted" id="qTime"></span></div><div id="quotes"><div class="side-empty">불러오는 중...</div></div></div>
      <div class="side-card"><div class="side-h"><span>📰 경제뉴스</span><span class="muted" id="nTime"></span></div><div id="news"><div class="side-empty">불러오는 중...</div></div></div>
    </aside>
  </div>
</div>

<!-- 업무 상세 -->
<div class="ov" id="detailOv"><div class="panel" id="detailPanel"></div></div>

<!-- 등록/수정 폼 -->
<div class="ov" id="formOv"><div class="panel">
  <div class="ph"><h2 id="fHead">새 업무 등록</h2><button class="x" id="fClose">✕</button></div>
  <div id="fTypeRow">
    <label>업무 구분</label>
    <select id="fType"><option value="loan">대출진행 (단계별)</option><option value="general">일반업무 (단건)</option></select>
    <div id="fStageRow"><label>현재 진행 단계 (이전 단계는 완료 처리됩니다)</label><select id="fStage"></select></div>
  </div>
  <label id="fTitleLabel">고객명 / 대출 건명</label><input id="fTitle" />
  <label>상세 (선택)</label><textarea id="fDetail" rows="2"></textarea>
  <div class="row">
    <div><label>요청자</label><input id="fBy" placeholder="예: 김상무" /></div>
    <div><label>기한</label><input id="fDue" type="date" /></div>
  </div>
  <label>담당자 (체크한 사람에게 알림)</label><div class="checks" id="fAsg"></div>
  <div class="acts" style="margin-top:20px"><button class="btn primary" id="fSave" style="min-height:44px;padding:8px 28px">저장</button><button class="btn" id="fCancel" style="min-height:44px">취소</button></div>
</div></div>

<script>
  // 새 Supabase 프로젝트의 값 (Project Settings > API)
  const SUPABASE_URL = "https://mknsdknryqqewewxmbpf.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_7RCkTtp_pNvzXe2MuYKqpg_wtfyVPO8";
  // 텔레그램 봇 사용자명 (@ 제외)
  const BOT_USERNAME = "todo_fairy_bot";

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // 업무 유형별 단계 (나중에 채권관리 등 유형을 추가할 때 여기에 추가)
  const LOAN_STEPS = ['대출상담', '대출신청', '감정평가', '내부결재', '대출실행'];
  const GROUPS = [['over', '🔴 기한초과'], ['today', '🟠 오늘마감'], ['prog', '⚪ 진행중'], ['done', '✅ 완료']];
  const PALETTE = ['#e2483d', '#d97706', '#1f845a', '#0c66e4', '#8250df', '#c9348c', '#0f7a8a', '#5e6c84'];

  let me = '', members = [], tasks = [], openId = null, formMode = 'new', editId = null;
  let fType = 'all', fGrp = null;     // 구분 필터 / 타일로 고른 그룹
  try { fType = localStorage.getItem('fType') || 'all'; } catch (e) {}

  const nameOf = (e) => (members.find(m => m.email === e) || {}).name || e;
  const colorOf = (e) => { let h = 0; for (const c of e) h = (h * 31 + c.charCodeAt(0)) >>> 0; return PALETTE[h % PALETTE.length]; };
  const initial = (e) => (nameOf(e) || '?').trim().slice(0, 1);
  const kstToday = () => new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
  const fmtMD = (d) => { const [, m, dd] = d.split('-'); return `${+m}/${+dd}`; };
  const fmtTs = (iso) => { const d = new Date(iso); return `${d.getMonth() + 1}/${d.getDate()}`; };

  // ---------- 로그인 ----------
  async function doLogin(){
    const email = $('emailInput').value.trim(), password = $('pwInput').value;
    if (!email || !password) return;
    $('loginMsg').textContent = '로그인 중...';
    const { error } = await sb.auth.signInWithPassword({ email, password });
    $('loginMsg').textContent = error ? '로그인 실패: 이메일 또는 비밀번호를 확인해주세요.' : '';
  }
  $('loginBtn').onclick = doLogin;
  $('pwInput').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  $('logout').onclick = () => sb.auth.signOut();
  sb.auth.onAuthStateChange((_e, session) => session ? start(session) : show(false));
  function show(on){ $('login').style.display = on ? 'none' : 'flex'; $('app').style.display = on ? 'flex' : 'none'; }

  async function start(session){
    const { data: ok } = await sb.rpc('is_member');
    if (!ok){ await sb.auth.signOut(); show(false); $('loginMsg').textContent = '등록되지 않은 이메일입니다.'; return; }
    me = session.user.email; show(true);
    const { data } = await sb.from('team_members').select('email,name').order('name');
    members = data || [];
    $('who').textContent = nameOf(me);
    await loadTelegram(); await loadTasks(); ensureSide();
  }

  // ---------- 텔레그램 ----------
  async function loadTelegram(forceCard){
    const { data } = await sb.from('telegram_links').select('chat_id, link_code').eq('email', me).maybeSingle();
    const linked = !!(data && data.chat_id), pending = !!(data && data.link_code);
    const pill = $('tgPill'), banner = $('tgBanner');
    if (linked && !pending && !forceCard){
      banner.style.display = 'none'; pill.style.display = ''; pill.textContent = '🔔 알림 연결됨'; pill.onclick = () => loadTelegram(true);
      return;
    }
    pill.style.display = 'none'; banner.style.display = 'flex';
    $('tgStatus').innerHTML = (linked ? '새 텔레그램으로 다시 연결합니다. ' : '연결되지 않았습니다. ')
      + '<button class="btn small primary" id="tgBtn">텔레그램 연결하기</button>'
      + (linked ? ' <button class="btn small" id="tgCancel">취소</button>' : '');
    if (linked) $('tgCancel').onclick = async () => { await sb.from('telegram_links').update({ link_code: null }).eq('email', me); loadTelegram(); };
    $('tgBtn').onclick = async () => {
      const code = crypto.randomUUID().replace(/-/g, '');
      // chat_id 는 건드리지 않고 코드만 갱신 (연결 완료 전까지 기존 연결 유지)
      const { error } = await sb.from('telegram_links').upsert({ email: me, link_code: code });
      if (error) return alert(error.message);
      window.open(`https://t.me/${BOT_USERNAME}?start=${code}`, '_blank');
      $('tgStatus').innerHTML = '텔레그램에서 <b>시작(START)</b>을 누른 뒤 <button class="btn small" id="tgRe">연결 확인</button>';
      $('tgRe').onclick = () => loadTelegram();
    };
  }

  // ---------- 데이터 ----------
  async function loadTasks(){
    const { data, error } = await sb.from('work_tasks')
      .select('*, work_task_assignees(email, done_at), work_task_steps(seq, name, done_at, done_by)')
      .order('due_date', { ascending: true, nullsFirst: false }).order('id', { ascending: false });
    if (error){ $('list').innerHTML = `<div class="empty">${esc(error.message)}</div>`; return; }
    tasks = data || [];
    render();
    if (openId) { const t = byId(openId); if (t) renderDetail(t); else closeDetail(); }
  }
  const byId = (id) => tasks.find(t => t.id === id);
  const stepsOf = (t) => [...t.work_task_steps].sort((a, b) => a.seq - b.seq);
  const isDone = (t) => t.task_type === 'loan' ? (t.work_task_steps.length > 0 && t.work_task_steps.every(s => s.done_at)) : t.work_task_assignees.every(a => a.done_at);
  const curIdx = (t) => { const s = stepsOf(t); const i = s.findIndex(x => !x.done_at); return i < 0 ? s.length : i; };
  const dueGrp = (t, today) => isDone(t) ? 'done' : (t.due_date && t.due_date < today) ? 'over' : (t.due_date === today) ? 'today' : 'prog';
  const canAct = (t) => t.created_by === me || t.work_task_assignees.some(a => a.email === me);
  const canUndoStep = (t, s) => t.created_by === me || s.done_by === me;

  // ---------- 목록 렌더 ----------
  function render(){
    const today = kstToday(), q = $('q').value.trim().toLowerCase(), status = $('status').value, mine = $('mine').checked;

    // 요약 타일 (필터와 무관한 전체 기준)
    const open = tasks.filter(t => !isDone(t));
    const cnt = (g) => open.filter(t => dueGrp(t, today) === g).length;
    const tiles = [
      ['over', cnt('over'), '기한초과', 'grp:over'], ['today', cnt('today'), '오늘마감', 'grp:today'],
      ['', open.length, '미완료 전체', 'grp:'], ['loan', open.filter(t => t.task_type === 'loan').length, '진행 중 대출', 'type:loan'],
    ];
    $('tiles').innerHTML = tiles.map(([c, n, l, act]) => {
      const sel = (act === 'grp:' && !fGrp && fType === 'all') || (act.startsWith('grp:') && act.slice(4) && fGrp === act.slice(4)) || (act === 'type:loan' && fType === 'loan' && !fGrp);
      return `<button class="tile ${c} ${sel ? 'sel' : ''}" data-tile="${act}"><div class="n">${n}</div><div class="l">${l}</div></button>`;
    }).join('');
    document.querySelectorAll('#typeSeg button').forEach(b => b.classList.toggle('on', b.dataset.type === fType));

    // 필터
    const shown = tasks.filter(t =>
      (fType === 'all' || (fType === 'loan') === (t.task_type === 'loan'))
      && (!mine || t.work_task_assignees.some(a => a.email === me))
      && (status === 'all' || (status === 'done') === isDone(t))
      && (!fGrp || dueGrp(t, today) === fGrp)
      && (!q || [t.title, t.detail, t.directed_by].some(v => (v || '').toLowerCase().includes(q))));

    $('list').innerHTML = GROUPS.map(([k, label]) => {
      const items = shown.filter(t => dueGrp(t, today) === k);
      return items.length ? `<div class="sec-h ${k}">${label}<span class="n">${items.length}</span></div>${items.map(rowHtml).join('')}` : '';
    }).join('') || '<div class="empty">표시할 업무가 없습니다.</div>';
  }

  function rowHtml(t){
    const today = kstToday(), g = dueGrp(t, today), loan = t.task_type === 'loan', steps = stepsOf(t), asg = t.work_task_assignees;
    const sub = [t.directed_by && `요청: ${t.directed_by}`, t.detail].filter(Boolean).join(' · ');
    let prog, act = '';
    if (loan){
      const ci = curIdx(t), c = steps[ci];
      prog = `<span class="segs">${steps.map((s, i) => `<i class="${s.done_at ? 'ok' : i === ci ? 'cur' : ''}"></i>`).join('')}</span>`
        + (c ? `<span class="pl"><b>${esc(c.name)}</b> ${ci + 1}/${steps.length}</span>` : `<span class="pl ok">전 단계 완료</span>`);
      if (c && canAct(t)) act = `<button class="go" data-go="step:${t.id}:${c.seq}">✔ ${esc(c.name)} 완료</button>`;
    } else {
      const pend = asg.filter(a => !a.done_at);
      prog = pend.length ? `<span class="pl">${asg.length - pend.length}/${asg.length} 완료 · <b>${esc(pend.map(a => nameOf(a.email)).join(', '))}</b> 대기</span>` : `<span class="pl ok">전원 완료</span>`;
      if (asg.some(a => a.email === me && !a.done_at)) act = `<button class="go" data-go="mine:${t.id}">✔ 내 일 완료</button>`;
    }
    const due = t.due_date ? `<span class="chip ${g === 'over' ? 'over' : g === 'today' ? 'today' : g === 'done' ? 'ok' : ''}">🕐 ${fmtMD(t.due_date)}</span>` : '<span class="muted">-</span>';
    const avs = `<div class="avs">${asg.map(a => `<span class="av ${!loan && a.done_at ? 'done' : ''}" style="background:${colorOf(a.email)}" title="${esc(nameOf(a.email))}">${esc(initial(a.email))}</span>`).join('')}</div>`;
    return `<div class="trow ${g === 'done' ? 'done' : ''}" data-id="${t.id}">
      <div class="c-type"><span class="tp ${loan ? 'loan' : ''}">${loan ? '대출' : '일반'}</span></div>
      <div class="c-title"><div class="tt">${esc(t.title)}</div>${sub ? `<div class="ts">${esc(sub)}</div>` : ''}</div>
      <div class="c-prog prog">${prog}</div><div class="c-who">${avs}</div><div class="c-due">${due}</div><div class="c-act">${act}</div></div>`;
  }

  // ---------- 오른쪽 열: 시세 / 경제뉴스 (넓은 화면에서만) ----------
  const wide = () => window.matchMedia('(min-width:1500px)').matches;
  const hhmm = (iso) => { const d = new Date(iso); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
  const ago = (iso) => { if (!iso) return ''; const m = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000)); return m < 1 ? '방금' : m < 60 ? `${m}분 전` : m < 1440 ? `${Math.floor(m / 60)}시간 전` : `${Math.floor(m / 1440)}일 전`; };
  const fnum = (n, d) => Number(n).toLocaleString('ko-KR', { minimumFractionDigits: d, maximumFractionDigits: d });
  let quotesOk = false, newsOk = false;
  async function loadQuotes(){
    const { data, error } = await sb.functions.invoke('info-feed', { body: { type: 'quotes' } });
    if (error || !data || !data.quotes || !data.quotes.length){ if (!quotesOk) $('quotes').innerHTML = '<div class="side-empty">시세를 불러오지 못했습니다.<br>잠시 후 다시 시도합니다.</div>'; return; }
    quotesOk = true;
    $('qTime').textContent = hhmm(data.updated) + ' 기준';
    $('quotes').innerHTML = data.quotes.map(q => {
      const cls = Math.abs(q.pct) < 0.005 ? 'flat' : q.change > 0 ? 'up' : 'down', arrow = cls === 'flat' ? '' : q.change > 0 ? '▲' : '▼';
      return `<div class="q-row"><span class="q-name">${esc(q.name)}</span><span class="q-price">${esc(q.prefix)}${fnum(q.price, q.dec)}${esc(q.suffix)}</span>
        <span class="q-chg ${cls}">${arrow} ${fnum(Math.abs(q.change), q.dec)} (${fnum(Math.abs(q.pct), 2)}%)</span></div>`;
    }).join('');
  }
  async function loadNews(){
    const { data, error } = await sb.functions.invoke('info-feed', { body: { type: 'news' } });
    if (error || !data || !data.items || !data.items.length){ if (!newsOk) $('news').innerHTML = '<div class="side-empty">뉴스를 불러오지 못했습니다.<br>잠시 후 다시 시도합니다.</div>'; return; }
    newsOk = true;
    $('nTime').textContent = hhmm(data.updated) + ' 기준';
    $('news').innerHTML = data.items.filter(n => /^https?:\/\//.test(n.link)).map(n =>
      `<a class="ni" href="${esc(n.link)}" target="_blank" rel="noopener noreferrer"><div class="nm"><span class="src">${esc(n.source)}</span><span>${ago(n.date)}</span></div><div class="nt">${esc(n.title)}</div></a>`).join('');
  }
  let sideTimers = false;
  function ensureSide(){
    if (!wide()) return;
    if (!quotesOk) loadQuotes();
    if (!newsOk) loadNews();
    if (!sideTimers){
      sideTimers = true;
      setInterval(() => { if (!document.hidden && wide()) loadQuotes(); }, 60000);     // 시세 1분마다
      setInterval(() => { if (!document.hidden && wide()) loadNews(); }, 300000);       // 뉴스 5분마다
    }
  }
  let rzT; window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(ensureSide, 300); });

  // ---------- 동작 (공통) ----------
  async function completeStep(tid, seq){
    const { error } = await sb.from('work_task_steps').update({ done_at: new Date().toISOString() }).eq('task_id', tid).eq('seq', seq);
    if (error){ alert(error.message); return false; }
    await sb.functions.invoke('task-notify', { body: { event: 'step_done', task_id: tid, seq } });
    return true;
  }
  async function undoStep(tid, seq){
    const { error } = await sb.from('work_task_steps').update({ done_at: null }).eq('task_id', tid).eq('seq', seq);
    if (error){ alert(error.message); return false; }
    await sb.functions.invoke('task-notify', { body: { event: 'step_undo', task_id: tid, seq } });
    return true;
  }
  async function toggleAssignee(tid, email, checked){
    const { error } = await sb.from('work_task_assignees').update({ done_at: checked ? new Date().toISOString() : null }).eq('task_id', tid).eq('email', email);
    if (error){ alert(error.message); return; }
    if (checked) await sb.functions.invoke('task-notify', { body: { event: 'done', task_id: tid } });
  }

  // ---------- 이벤트 ----------
  $('typeSeg').onclick = (e) => { const b = e.target.closest('[data-type]'); if (!b) return; fType = b.dataset.type; fGrp = null; try { localStorage.setItem('fType', fType); } catch (x) {} render(); };
  $('status').onchange = () => { fGrp = null; render(); };
  $('mine').onchange = render;
  let qTimer; $('q').oninput = () => { clearTimeout(qTimer); qTimer = setTimeout(render, 200); };
  $('tiles').onclick = (e) => {
    const b = e.target.closest('[data-tile]'); if (!b) return;
    const [kind, val] = b.dataset.tile.split(':');
    if (kind === 'grp'){ fGrp = val || null; if (fGrp){ $('status').value = 'open'; } else { fType = 'all'; $('status').value = 'open'; } }
    else { fType = val; fGrp = null; $('status').value = 'open'; }
    render();
  };
  $('list').addEventListener('click', async (e) => {
    const go = e.target.closest('[data-go]');
    if (go){
      e.stopPropagation(); go.disabled = true;
      const [kind, tid, seq] = go.dataset.go.split(':');
      if (kind === 'step') await completeStep(+tid, +seq); else await toggleAssignee(+tid, me, true);
      return loadTasks();
    }
    const row = e.target.closest('[data-id]');
    if (row) openDetail(+row.dataset.id);
  });

  // ---------- 상세 ----------
  function openDetail(id){ openId = id; renderDetail(byId(id)); $('detailOv').style.display = 'block'; document.body.style.overflow = 'hidden'; }
  function closeDetail(){ openId = null; $('detailOv').style.display = 'none'; document.body.style.overflow = ''; }
  $('detailOv').addEventListener('click', (e) => { if (e.target === $('detailOv')) closeDetail(); });

  function renderDetail(t){
    if (!t) return;
    const loan = t.task_type === 'loan', today = kstToday(), g = dueGrp(t, today), steps = stepsOf(t);
    const cur = steps[curIdx(t)];
    let body = '';
    if (t.detail) body += `<div class="kv"><div class="k">상세</div><div class="v">${esc(t.detail)}</div></div>`;
    const info = [t.directed_by && `요청: ${t.directed_by}`, t.due_date && `기한: ${t.due_date}`].filter(Boolean).join('  ·  ');
    if (info) body += `<div class="kv"><div class="k">정보</div><div class="v">${esc(info)}</div></div>`;
    if (loan){
      const lastDone = [...steps].reverse().find(s => s.done_at);
      body += `<div class="kv"><div class="k">진행 단계</div><div class="steps">${steps.map(s => `<div class="step ${s.done_at ? 'ok' : (cur && cur.seq === s.seq ? 'cur' : '')}">
        <span>${s.done_at ? '✓' : s.seq}</span><span>${esc(s.name)}</span>${s.done_at && s.done_by ? `<small>${esc(nameOf(s.done_by))} ${fmtTs(s.done_at)}</small>` : ''}</div>`).join('')}</div>
        ${canAct(t) ? `<div class="acts">${cur ? `<button class="btn primary" data-d="step:${cur.seq}">✔ ${esc(cur.name)} 완료</button>` : ''}
        ${lastDone && canUndoStep(t, lastDone) ? `<button class="btn" data-d="undo:${lastDone.seq}">↩ ${esc(lastDone.name)} 되돌리기</button>` : ''}</div>` : ''}</div>`;
      body += `<div class="kv"><div class="k">담당자</div><div class="v">${esc(t.work_task_assignees.map(a => nameOf(a.email)).join(', '))}</div></div>`;
    } else {
      body += `<div class="kv"><div class="k">담당자별 진행</div>${t.work_task_assignees.map(a => `<div class="asg ${a.done_at ? 'ok' : ''}">
        <input type="checkbox" ${a.done_at ? 'checked' : ''} ${a.email === me ? '' : 'disabled'} data-d="chk:${esc(a.email)}" />
        <span class="av" style="background:${colorOf(a.email)};margin:0">${esc(initial(a.email))}</span>${esc(nameOf(a.email))} ${a.done_at ? '✓ 완료' : '미완료'}</div>`).join('')}</div>`;
    }
    const lbl = `<span class="tp ${loan ? 'loan' : ''}">${loan ? '대출진행' : '일반업무'}</span> `
      + (g === 'over' ? '<span class="chip over">기한초과</span>' : g === 'today' ? '<span class="chip today">오늘마감</span>' : g === 'done' ? '<span class="chip ok">완료</span>' : '');
    $('detailPanel').innerHTML = `<div class="ph"><div><div style="margin-bottom:8px">${lbl}</div><h2>${esc(t.title)}</h2></div><button class="x" data-d="close">✕</button></div>${body}
      ${t.created_by === me ? `<div class="foot"><button class="btn" data-d="edit">✏ 수정</button><button class="btn danger" data-d="del">삭제</button></div>` : ''}`;
  }
  $('detailPanel').addEventListener('click', async (e) => {
    const b = e.target.closest('[data-d]'); if (!b || b.tagName === 'INPUT') return;
    const t = byId(openId); if (!t) return;
    const [kind, arg] = b.dataset.d.split(':');
    if (kind === 'close') return closeDetail();
    if (kind === 'edit') return openForm('edit', t.id);
    if (kind === 'del'){ if (!confirm('이 업무를 삭제할까요?')) return; await sb.from('work_tasks').delete().eq('id', t.id); closeDetail(); return loadTasks(); }
    b.disabled = true;
    if (kind === 'step') await completeStep(t.id, +arg);
    if (kind === 'undo' && confirm('이 단계를 되돌릴까요?')) await undoStep(t.id, +arg);
    loadTasks();
  });
  $('detailPanel').addEventListener('change', async (e) => {
    const cb = e.target.closest('input[data-d^="chk:"]'); if (!cb) return;
    await toggleAssignee(openId, cb.dataset.d.slice(4), cb.checked); loadTasks();
  });

  // ---------- 등록/수정 폼 ----------
  $('fStage').innerHTML = LOAN_STEPS.map((n, i) => `<option value="${i}">${n}</option>`).join('');
  function syncType(){
    const loan = $('fType').value === 'loan';
    $('fStageRow').style.display = loan ? 'block' : 'none';
    $('fTitleLabel').textContent = loan ? '고객명 / 대출 건명' : '업무 내용';
    $('fTitle').placeholder = loan ? '예: 홍길동 담보대출 1억' : '예: 3분기 연체 현황 보고서 작성';
  }
  $('fType').onchange = syncType;
  function openForm(mode, id){
    formMode = mode; editId = id;
    const t = id ? byId(id) : null;
    $('fHead').textContent = mode === 'edit' ? '업무 수정' : '새 업무 등록';
    $('fTypeRow').style.display = mode === 'edit' ? 'none' : 'block';
    if (mode === 'new'){ $('fType').value = fType === 'general' ? 'general' : 'loan'; $('fStage').value = '0'; syncType(); }
    else $('fTitleLabel').textContent = t.task_type === 'loan' ? '고객명 / 대출 건명' : '업무 내용';
    $('fTitle').value = t ? t.title : ''; $('fDetail').value = t ? (t.detail || '') : ''; $('fBy').value = t ? (t.directed_by || '') : ''; $('fDue').value = t ? (t.due_date || '') : '';
    const cur = new Set(t ? t.work_task_assignees.map(a => a.email) : [me]);
    $('fAsg').innerHTML = members.map(m => `<label><input type="checkbox" value="${esc(m.email)}" ${cur.has(m.email) ? 'checked' : ''}/> ${esc(m.name)}</label>`).join('');
    $('formOv').style.display = 'block'; document.body.style.overflow = 'hidden';
    setTimeout(() => { try { $('fTitle').focus(); } catch (e) {} }, 50);
  }
  function closeForm(){ $('formOv').style.display = 'none'; editId = null; document.body.style.overflow = $('detailOv').style.display === 'block' ? 'hidden' : ''; }
  $('fClose').onclick = closeForm; $('fCancel').onclick = closeForm;
  $('formOv').addEventListener('click', (e) => { if (e.target === $('formOv')) closeForm(); });
  $('newBtn').onclick = () => openForm('new', null);

  $('fSave').onclick = async () => {
    const title = $('fTitle').value.trim();
    const emails = [...document.querySelectorAll('#fAsg input:checked')].map(i => i.value);
    if (!title || !emails.length) return alert('내용과 담당자를 입력해주세요.');
    const patch = { title, detail: $('fDetail').value.trim() || null, directed_by: $('fBy').value.trim() || null, due_date: $('fDue').value || null };
    $('fSave').disabled = true;
    try {
      if (formMode === 'edit'){
        const t = byId(editId); if (!t) return;
        const changed = ['title', 'detail', 'directed_by', 'due_date'].some(k => (t[k] || null) !== patch[k]);
        const before = t.work_task_assignees.map(a => a.email);
        const added = emails.filter(e => !before.includes(e)), removed = before.filter(e => !emails.includes(e));
        let err = (await sb.from('work_tasks').update(patch).eq('id', t.id)).error;
        if (!err && removed.length) err = (await sb.from('work_task_assignees').delete().eq('task_id', t.id).in('email', removed)).error;
        if (!err && added.length) err = (await sb.from('work_task_assignees').insert(added.map(email => ({ task_id: t.id, email })))).error;
        if (err) return alert(err.message);
        if (changed || added.length) await sb.functions.invoke('task-notify', { body: { event: 'updated', task_id: t.id, added, changed } });
      } else {
        const type = $('fType').value;
        const { data: nt, error } = await sb.from('work_tasks').insert({ ...patch, task_type: type }).select('id').single();
        if (error) return alert(error.message);
        await sb.from('work_task_assignees').insert(emails.map(email => ({ task_id: nt.id, email })));
        if (type === 'loan'){
          const startIdx = +$('fStage').value, now = new Date().toISOString();
          const { error: e2 } = await sb.from('work_task_steps').insert(LOAN_STEPS.map((name, i) => ({ task_id: nt.id, seq: i + 1, name, done_at: i < startIdx ? now : null })));
          if (e2) return alert(e2.message);
        }
        await sb.functions.invoke('task-notify', { body: { event: 'created', task_id: nt.id } });
        if (fType !== 'all' && fType !== type) fType = 'all';   // 새로 등록한 업무가 필터에 가려지지 않게
        fGrp = null; $('status').value = 'open';
      }
      closeForm(); await loadTasks();
    } finally { $('fSave').disabled = false; }
  };
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape'){ if ($('formOv').style.display === 'block') closeForm(); else if ($('detailOv').style.display === 'block') closeDetail(); } });
</script>
</body>
