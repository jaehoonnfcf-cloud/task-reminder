<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#f7f8fa" />
<title>할일요정</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
<style>
  :root{ --ink:#252a34; --paper:#f7f8fa; --panel:#fff; --line:#e7e9ec; --accent:#2e73fc; --accent-soft:#e8f2fe;
    --danger:#a4443a; --muted:#767b85; --green:#1a7a4c; --green-soft:#e3f5ea; --warn:#b5601f; --warn-soft:#fdecd4; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif; letter-spacing:-0.01em; }
  .wrap{ max-width:760px; margin:0 auto; padding:24px 16px 64px; display:flex; flex-direction:column; gap:18px; }
  header{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  h1{ font-size:20px; margin:0; } h2{ font-size:16px; margin:0 0 12px; }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px; }
  input,textarea,select,button{ font-family:inherit; font-size:14px; }
  input,textarea,select{ width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  label{ display:block; font-size:12.5px; color:var(--muted); margin:10px 0 4px; }
  .btn{ border:1px solid var(--line); background:#fff; padding:8px 14px; border-radius:8px; cursor:pointer; font-weight:600; }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.small{ padding:4px 10px; font-size:12px; }
  .muted{ color:var(--muted); font-size:13px; }
  .row{ display:flex; gap:10px; flex-wrap:wrap; } .row > *{ flex:1; min-width:140px; }
  .checks{ display:flex; flex-wrap:wrap; gap:8px 16px; } .checks label{ display:flex; align-items:center; gap:6px; margin:0; color:var(--ink); font-size:14px; }
  .checks input{ width:auto; }
  .task{ border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px; }
  .task.done{ opacity:.55; }
  .task .t{ font-weight:700; } .task .meta{ font-size:12.5px; color:var(--muted); margin-top:2px; white-space:pre-wrap; }
  .tag{ display:inline-block; font-size:11.5px; padding:2px 8px; border-radius:99px; margin-left:6px; }
  .tag.over{ background:#f7dedb; color:var(--danger); } .tag.today{ background:var(--warn-soft); color:var(--warn); }
  .asg{ display:flex; align-items:center; gap:8px; margin-top:8px; font-size:13.5px; }
  .asg input{ width:auto; } .asg.ok{ color:var(--green); }

  /* 아이폰/모바일 보정 */
  html{ -webkit-text-size-adjust:100%; }
  body{ -webkit-tap-highlight-color:transparent; }
  .wrap{ padding-left:max(16px, env(safe-area-inset-left)); padding-right:max(16px, env(safe-area-inset-right)); padding-bottom:max(64px, calc(env(safe-area-inset-bottom) + 32px)); }
  input,textarea,select{ font-size:16px; -webkit-appearance:none; appearance:none; border-radius:10px; min-height:44px; }
  textarea{ min-height:76px; }
  input[type=date]{ display:block; width:100%; min-width:0; background:#fff; }
  select{ background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%23767b85' stroke-width='2'/></svg>") no-repeat right 12px center; padding-right:32px; }
  .btn{ min-height:44px; font-size:15px; }
  .btn.small{ min-height:36px; padding:6px 12px; font-size:13px; }
  .checks label{ min-height:40px; font-size:15px; }
  .checks input{ width:22px; height:22px; min-height:0; -webkit-appearance:auto; appearance:auto; }
  .asg{ min-height:40px; font-size:15px; }
  .asg input{ width:22px; height:22px; min-height:0; -webkit-appearance:auto; appearance:auto; flex-shrink:0; }
  .task .t{ word-break:break-word; line-height:1.4; }
  .row > *{ min-width:0; }
  @media (max-width:520px){
    .wrap{ gap:14px; padding-top:max(16px, env(safe-area-inset-top)); }
    .card{ padding:16px; border-radius:12px; }
    .row > *{ flex:1 1 100%; }
    h1{ font-size:18px; }
    #filter{ min-width:110px; }
  }
  .tag.loan{ background:var(--accent-soft); color:var(--accent); margin-left:0; margin-right:6px; }
  .steps{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .step{ display:flex; align-items:center; gap:6px; padding:6px 11px; border-radius:99px; border:1px solid var(--line); font-size:13.5px; color:var(--muted); background:#fff; }
  .step .dot{ font-size:12px; }
  .step.ok{ background:var(--green-soft); color:var(--green); border-color:transparent; }
  .step.cur{ background:var(--accent-soft); color:var(--accent); border-color:var(--accent); font-weight:700; }
  .step small{ font-size:11px; opacity:.8; }
  .stepbtns{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  #editOv{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:10; overflow:auto; padding:max(16px, env(safe-area-inset-top)) 16px 32px; -webkit-overflow-scrolling:touch; }
  .rowbtns{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  /* 레이아웃: 모바일은 세로 한 줄, PC(1024px~)는 왼쪽 입력 / 오른쪽 목록 */
  #side,#main{ display:flex; flex-direction:column; gap:18px; min-width:0; }
  .pc-only{ display:none; }
  .grp-h{ display:none; }
  .summary{ gap:12px; }
  .tile{ flex:1; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
  .tile .n{ font-size:26px; font-weight:800; line-height:1.1; }
  .tile .l{ font-size:12.5px; color:var(--muted); margin-top:4px; }
  .tile.over .n{ color:var(--danger); } .tile.today .n{ color:var(--warn); } .tile.loan .n{ color:var(--accent); }
  .toolbar{ gap:10px; margin-top:12px; }
  .toolbar input{ flex:1; } .toolbar select{ width:auto; min-width:130px; }
  @media (min-width:1024px){
    .wrap{ max-width:1280px; display:grid; grid-template-columns:360px minmax(0,1fr); gap:24px; align-items:start; padding-top:28px; }
    header{ grid-column:1 / -1; }
    #side{ position:sticky; top:16px; max-height:calc(100vh - 32px); overflow-y:auto; padding-bottom:4px; }
    .pc-only.summary{ display:flex; } .pc-only.toolbar{ display:flex; }
    .grp-h{ display:block; font-size:14px; font-weight:800; margin:18px 0 8px; }
    .grp-h:first-child{ margin-top:0; } .grp-h span{ color:var(--muted); font-weight:600; }
    .group-items{ display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:12px; align-items:start; }
    .group-items .task{ margin:0; }
    .card{ padding:22px; }
    body{ font-size:16px; background:#eef0f4; }
    h1{ font-size:24px; } h2{ font-size:18px; }
    /* PC: 아이폰처럼 크고 또렷하게 (입력 16px / 버튼 15px / 터치영역 넉넉히) */
    input,textarea,select{ font-size:16px; min-height:46px; padding:10px 14px; border-color:#cfd4dc; }
    select{ padding-right:36px; }
    textarea{ min-height:84px; }
    .btn{ font-size:15px; min-height:46px; padding:10px 22px; border-color:#cfd4dc; }
    .btn.small{ font-size:14px; min-height:38px; padding:6px 16px; }
    label{ font-size:14px; color:#4b5160; margin:14px 0 6px; }
    .muted, .task .meta{ color:#5b616b; }
    .task{ border-color:#d6dae1; padding:18px; }
    .task .t{ font-size:17px; }
    .task .meta{ font-size:14px; margin-top:4px; }
    .checks label, .asg{ font-size:16px; min-height:38px; }
    .checks input, .asg input{ width:20px; height:20px; }
    .step{ font-size:14px; padding:6px 13px; }
    .tag{ font-size:12.5px; padding:3px 10px; }
    .card{ padding:26px; border-color:#dde1e7; box-shadow:0 1px 3px rgba(16,24,40,.06); }
    .tile{ padding:18px 20px; border-color:#dde1e7; box-shadow:0 1px 3px rgba(16,24,40,.06); }
    .tile .n{ font-size:30px; } .tile .l{ font-size:14px; color:#5b616b; }
    .grp-h{ font-size:16px; margin:22px 0 10px; }
    .group-items{ grid-template-columns:repeat(auto-fill,minmax(380px,1fr)); gap:14px; }
    .wrap{ grid-template-columns:400px minmax(0,1fr); }
  }
  #login,#app{ display:none; }
  .center{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
  .center .card{ width:100%; max-width:340px; text-align:center; }
</style>
</head>
<body>
<div id="login" class="center"><div class="card">
  <h1>🧚 할일요정</h1>
  <p class="muted">등록된 이메일과 비밀번호로 로그인합니다.</p>
  <input id="emailInput" type="email" placeholder="이메일" autocomplete="username" />
  <input id="pwInput" type="password" placeholder="비밀번호" autocomplete="current-password" style="margin-top:8px" />
  <button class="btn primary" id="sendLink" style="width:100%;margin-top:10px">로그인</button>
  <p id="loginMsg" class="muted"></p>
</div></div>

<div id="editOv"><div class="card" style="max-width:560px;margin:0 auto">
  <h2>업무 수정</h2>
  <label>업무 내용</label><input id="eTitle" />
  <label>상세</label><textarea id="eDetail" rows="2"></textarea>
  <div class="row">
    <div><label>지시자</label><input id="eBy" /></div>
    <div><label>기한</label><input id="eDue" type="date" /></div>
  </div>
  <label>담당자</label><div class="checks" id="eAsg"></div>
  <div class="rowbtns"><button class="btn primary" id="eSave">저장</button><button class="btn" id="eCancel">취소</button></div>
</div></div>

<div id="app"><div class="wrap">
  <header><h1>🧚 할일요정</h1><div><span class="muted" id="who"></span> <button class="btn small" id="logout">로그아웃</button></div></header>

  <aside id="side">
  <div class="card" id="tgCard">
    <h2>🔔 텔레그램 알림</h2>
    <div id="tgStatus" class="muted"></div>
  </div>

  <div class="card">
    <h2>새 업무지시 등록</h2>
    <label>업무 구분</label>
    <select id="fType"><option value="general">일반업무 (단건 지시)</option><option value="loan">대출진행 (단계별)</option></select>
    <div id="loanOpt" style="display:none"><label>현재 진행 단계 (이전 단계는 완료 처리됩니다)</label><select id="fStage"></select></div>
    <label id="fTitleLabel">업무 내용</label><input id="fTitle" placeholder="예: 3분기 연체 현황 보고서 작성" />
    <label>상세 (선택)</label><textarea id="fDetail" rows="2"></textarea>
    <div class="row">
      <div><label>지시자</label><input id="fBy" placeholder="예: 김상무" /></div>
      <div><label>기한</label><input id="fDue" type="date" /></div>
    </div>
    <label>담당자 (체크한 사람에게 알림)</label><div class="checks" id="fAsg"></div>
    <button class="btn primary" id="addBtn" style="margin-top:14px">등록</button>
  </div>
  </aside>

  <main id="main">
  <div class="summary pc-only" id="summary"></div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2 style="margin:0">업무 목록</h2>
      <select id="filter" style="width:auto"><option value="open">미완료</option><option value="all">전체</option><option value="done">완료</option></select>
    </div>
    <div class="toolbar pc-only">
      <input id="q" type="search" placeholder="🔍 업무·고객명·지시자 검색" />
      <select id="typeFilter"><option value="all">전체 구분</option><option value="general">일반업무</option><option value="loan">대출진행</option></select>
    </div>
    <div id="list" style="margin-top:14px"></div>
  </div>
  </main>
</div></div>

<script>
  // 새 Supabase 프로젝트의 값으로 교체하세요 (Project Settings > API)
  const SUPABASE_URL = "https://mknsdknryqqewewxmbpf.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_7RCkTtp_pNvzXe2MuYKqpg_wtfyVPO8";
  // 텔레그램 봇 사용자명 (@BotFather 에서 만든 봇, @ 제외)
  const BOT_USERNAME = "todo_fairy_bot";

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  // 업무 유형별 단계 (나중에 채권관리 등 유형을 추가할 때 여기에 추가)
  const LOAN_STEPS = ['대출상담', '대출신청', '감정평가', '내부결재', '대출실행'];
  let tasksById = {}, editingId = null;
  let me = '', members = [], nameOf = (e) => e;
  const fmtD = (iso) => { const d = new Date(iso); return `${d.getMonth()+1}/${d.getDate()}`; };

  async function doLogin(){
    const email = $('emailInput').value.trim(), password = $('pwInput').value;
    if (!email || !password) return;
    $('loginMsg').textContent = '로그인 중...';
    const { error } = await sb.auth.signInWithPassword({ email, password });
    $('loginMsg').textContent = error ? '로그인 실패: 이메일 또는 비밀번호를 확인해주세요.' : '';
  }
  $('sendLink').onclick = doLogin;
  $('pwInput').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  $('logout').onclick = () => sb.auth.signOut();
  sb.auth.onAuthStateChange((_e, session) => session ? start(session) : show(false));
  function show(on){ $('login').style.display = on ? 'none' : 'flex'; $('app').style.display = on ? 'block' : 'none'; }

  async function start(session){
    const { data: ok } = await sb.rpc('is_member');
    if (!ok){ await sb.auth.signOut(); show(false); $('loginMsg').textContent = '등록되지 않은 이메일입니다.'; return; }
    me = session.user.email; show(true);
    const { data } = await sb.from('team_members').select('email,name').order('name');
    members = data || [];
    nameOf = (e) => (members.find(m => m.email === e) || {}).name || e;
    $('who').textContent = nameOf(me);
    $('fAsg').innerHTML = members.map(m => `<label><input type="checkbox" value="${esc(m.email)}" ${m.email===me?'checked':''}/> ${esc(m.name)}</label>`).join('');
    await loadTelegram(); await loadTasks();
  }

  async function loadTelegram(){
    const { data } = await sb.from('telegram_links').select('chat_id').eq('email', me).maybeSingle();
    if (data && data.chat_id){ $('tgStatus').innerHTML = '✅ 연결됨'; return; }
    $('tgStatus').innerHTML = '연결되지 않았습니다. <button class="btn small primary" id="tgBtn">텔레그램 연결하기</button>';
    $('tgBtn').onclick = async () => {
      const code = crypto.randomUUID().replace(/-/g, '');
      const { error } = await sb.from('telegram_links').upsert({ email: me, link_code: code, chat_id: null });
      if (error) return alert(error.message);
      window.open(`https://t.me/${BOT_USERNAME}?start=${code}`, '_blank');
      $('tgStatus').innerHTML = '텔레그램에서 <b>시작(START)</b>을 누른 뒤 <button class="btn small" id="tgRe">연결 확인</button>';
      $('tgRe').onclick = loadTelegram;
    };
  }

  $('fStage').innerHTML = LOAN_STEPS.map((n, i) => `<option value="${i}">${n}</option>`).join('');
  $('fType').onchange = () => {
    const loan = $('fType').value === 'loan';
    $('loanOpt').style.display = loan ? 'block' : 'none';
    $('fTitleLabel').textContent = loan ? '고객명 / 대출 건명' : '업무 내용';
    $('fTitle').placeholder = loan ? '예: 홍길동 담보대출 1억' : '예: 3분기 연체 현황 보고서 작성';
  };

  $('addBtn').onclick = async () => {
    const title = $('fTitle').value.trim();
    const emails = [...document.querySelectorAll('#fAsg input:checked')].map(i => i.value);
    if (!title || !emails.length) return alert('업무 내용과 담당자를 입력해주세요.');
    $('addBtn').disabled = true;
    const { data: t, error } = await sb.from('work_tasks').insert({
      title, detail: $('fDetail').value.trim() || null, directed_by: $('fBy').value.trim() || null, due_date: $('fDue').value || null,
      task_type: $('fType').value
    }).select('id').single();
    if (error){ $('addBtn').disabled = false; return alert(error.message); }
    await sb.from('work_task_assignees').insert(emails.map(email => ({ task_id: t.id, email })));
    if ($('fType').value === 'loan'){
      const startIdx = +$('fStage').value, now = new Date().toISOString();
      const { error: e2 } = await sb.from('work_task_steps').insert(LOAN_STEPS.map((name, i) => ({ task_id: t.id, seq: i + 1, name, done_at: i < startIdx ? now : null })));
      if (e2){ $('addBtn').disabled = false; return alert(e2.message); }
    }
    await sb.functions.invoke('task-notify', { body: { event: 'created', task_id: t.id } });
    ['fTitle','fDetail','fDue'].forEach(id => $(id).value = '');
    $('addBtn').disabled = false; loadTasks();
  };

  $('filter').onchange = loadTasks;
  $('typeFilter').onchange = loadTasks;
  let qTimer; $('q').oninput = () => { clearTimeout(qTimer); qTimer = setTimeout(loadTasks, 250); };
  function openEdit(id){
    const t = tasksById[id]; if (!t) return;
    editingId = id;
    $('eTitle').value = t.title; $('eDetail').value = t.detail || ''; $('eBy').value = t.directed_by || ''; $('eDue').value = t.due_date || '';
    const cur = new Set(t.work_task_assignees.map(a => a.email));
    $('eAsg').innerHTML = members.map(m => `<label><input type="checkbox" value="${esc(m.email)}" ${cur.has(m.email)?'checked':''}/> ${esc(m.name)}</label>`).join('');
    $('editOv').style.display = 'block';
  }
  $('eCancel').onclick = () => { $('editOv').style.display = 'none'; editingId = null; };
  $('eSave').onclick = async () => {
    const t = tasksById[editingId]; if (!t) return;
    const title = $('eTitle').value.trim();
    const emails = [...document.querySelectorAll('#eAsg input:checked')].map(i => i.value);
    if (!title || !emails.length) return alert('업무 내용과 담당자를 입력해주세요.');
    $('eSave').disabled = true;
    const patch = { title, detail: $('eDetail').value.trim() || null, directed_by: $('eBy').value.trim() || null, due_date: $('eDue').value || null };
    const changed = ['title','detail','directed_by','due_date'].some(k => (t[k] || null) !== patch[k]);
    const before = t.work_task_assignees.map(a => a.email);
    const added = emails.filter(e => !before.includes(e)), removed = before.filter(e => !emails.includes(e));
    let err = (await sb.from('work_tasks').update(patch).eq('id', t.id)).error;
    if (!err && removed.length) err = (await sb.from('work_task_assignees').delete().eq('task_id', t.id).in('email', removed)).error;
    if (!err && added.length) err = (await sb.from('work_task_assignees').insert(added.map(email => ({ task_id: t.id, email })))).error;
    $('eSave').disabled = false;
    if (err) return alert(err.message);
    $('editOv').style.display = 'none'; editingId = null;
    if (changed || added.length) await sb.functions.invoke('task-notify', { body: { event: 'updated', task_id: t.id, added, changed } });
    loadTasks();
  };

  function loanBlock(t){
    const steps = [...t.work_task_steps].sort((a, b) => a.seq - b.seq);
    const cur = steps.find(s => !s.done_at);
    const canAct = t.created_by === me || t.work_task_assignees.some(a => a.email === me);
    const lastDone = [...steps].reverse().find(s => s.done_at);
    const canUndo = canAct && lastDone && (t.created_by === me || lastDone.done_by === me);
    const chips = steps.map(s => `<div class="step ${s.done_at ? 'ok' : (cur && cur.seq === s.seq ? 'cur' : '')}">
      <span class="dot">${s.done_at ? '✓' : s.seq}</span><span>${esc(s.name)}</span>${s.done_at && s.done_by ? `<small>${esc(nameOf(s.done_by))} ${fmtD(s.done_at)}</small>` : ''}</div>`).join('');
    const btns = canAct ? `<div class="stepbtns">
      ${cur ? `<button class="btn small primary" data-step="${t.id}:${cur.seq}">✔ ${esc(cur.name)} 완료</button>` : ''}
      ${canUndo ? `<button class="btn small" data-undo="${t.id}:${lastDone.seq}">↩ ${esc(lastDone.name)} 되돌리기</button>` : ''}</div>` : '';
    return `<div class="meta">담당: ${esc(t.work_task_assignees.map(a => nameOf(a.email)).join(', '))}</div><div class="steps">${chips}</div>${btns}`;
  }

  async function loadTasks(){
    const { data, error } = await sb.from('work_tasks')
      .select('*, work_task_assignees(email, done_at), work_task_steps(seq, name, done_at, done_by)').order('due_date', { ascending: true, nullsFirst: false }).order('id', { ascending: false });
    if (error) { $('list').textContent = error.message; return; }
    tasksById = Object.fromEntries((data || []).map(t => [t.id, t]));
    const today = new Date(Date.now() + 9*3600e3).toISOString().slice(0,10);
    const f = $('filter').value;
    const isDone = (t) => t.task_type === 'loan'
      ? t.work_task_steps.length > 0 && t.work_task_steps.every(s => s.done_at)
      : t.work_task_assignees.every(a => a.done_at);
    const rows = (data || []).filter(t => f === 'all' || (f === 'done' ? isDone(t) : !isDone(t)));
    const cardHtml = (t) => {
      const done = isDone(t);
      const tag = done || !t.due_date ? '' : t.due_date < today ? '<span class="tag over">기한초과</span>' : t.due_date === today ? '<span class="tag today">오늘마감</span>' : '';
      const meta = [t.directed_by && `지시: ${t.directed_by}`, t.due_date && `기한: ${t.due_date}`].filter(Boolean).join(' · ');
      return `<div class="task ${done?'done':''}">
        <div class="t">${t.task_type === 'loan' ? '<span class="tag loan">대출</span>' : ''}${esc(t.title)}${tag}</div>
        <div class="meta">${esc(meta)}${t.detail ? '\n' + esc(t.detail) : ''}</div>
        ${t.task_type === 'loan' ? loanBlock(t) : t.work_task_assignees.map(a => `<div class="asg ${a.done_at?'ok':''}">
          <input type="checkbox" ${a.done_at?'checked':''} ${a.email===me?'':'disabled'} data-t="${t.id}" data-e="${esc(a.email)}" />
          ${esc(nameOf(a.email))} ${a.done_at ? '✓ 완료' : '미완료'}</div>`).join('')}
        ${t.created_by === me ? `<div class="rowbtns"><button class="btn small" data-edit="${t.id}">✏ 수정</button><button class="btn small" data-del="${t.id}">삭제</button></div>` : ''}
      </div>`;
    };

    // 요약 타일 (PC) — 필터와 무관하게 전체 기준
    const all = data || [];
    const grpOf = (t) => isDone(t) ? 'done' : (t.due_date && t.due_date < today) ? 'over' : (t.due_date === today) ? 'today' : 'prog';
    const open = all.filter(t => !isDone(t));
    $('summary').innerHTML = [
      ['over', open.filter(t => grpOf(t) === 'over').length, '기한초과'],
      ['today', open.filter(t => grpOf(t) === 'today').length, '오늘마감'],
      ['', open.length, '미완료 전체'],
      ['loan', open.filter(t => t.task_type === 'loan').length, '진행 중 대출'],
    ].map(([c, n, l]) => `<div class="tile ${c}"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');

    // 구분 필터·검색 (PC 입력칸은 모바일에서 숨겨져 기본값이라 영향 없음)
    const tf = $('typeFilter').value, q = $('q').value.trim().toLowerCase();
    const shown = rows.filter(t => (tf === 'all' || t.task_type === tf)
      && (!q || [t.title, t.detail, t.directed_by].some(v => (v || '').toLowerCase().includes(q))));
    const GROUPS = [['over', '🔴 기한초과'], ['today', '🟠 오늘마감'], ['prog', '⚪ 진행중'], ['done', '✅ 완료']];
    $('list').innerHTML = GROUPS.map(([k, label]) => {
      const items = shown.filter(t => grpOf(t) === k);
      return items.length ? `<div class="grp-h">${label} <span>${items.length}</span></div><div class="group-items">${items.map(cardHtml).join('')}</div>` : '';
    }).join('') || '<p class="muted">업무가 없습니다.</p>';
    $('list').querySelectorAll('input[data-t]').forEach(cb => cb.onchange = async () => {
      const { error } = await sb.from('work_task_assignees')
        .update({ done_at: cb.checked ? new Date().toISOString() : null }).eq('task_id', cb.dataset.t).eq('email', cb.dataset.e);
      if (error) return alert(error.message);
      if (cb.checked) await sb.functions.invoke('task-notify', { body: { event: 'done', task_id: +cb.dataset.t } });
      loadTasks();
    });
    $('list').querySelectorAll('[data-step]').forEach(b => b.onclick = async () => {
      const [tid, seq] = b.dataset.step.split(':').map(Number);
      b.disabled = true;
      const { error } = await sb.from('work_task_steps').update({ done_at: new Date().toISOString() }).eq('task_id', tid).eq('seq', seq);
      if (error){ alert(error.message); return loadTasks(); }
      await sb.functions.invoke('task-notify', { body: { event: 'step_done', task_id: tid, seq } });
      loadTasks();
    });
    $('list').querySelectorAll('[data-undo]').forEach(b => b.onclick = async () => {
      const [tid, seq] = b.dataset.undo.split(':').map(Number);
      if (!confirm('이 단계를 되돌릴까요?')) return;
      const { error } = await sb.from('work_task_steps').update({ done_at: null }).eq('task_id', tid).eq('seq', seq);
      if (error) alert(error.message);
      loadTasks();
    });
    $('list').querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openEdit(+b.dataset.edit));
    $('list').querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
      if (!confirm('이 업무를 삭제할까요?')) return;
      await sb.from('work_tasks').delete().eq('id', b.dataset.del); loadTasks();
    });
  }
</script>
